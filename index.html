<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Команд (Отладка)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="main-container">
        <h1>Конструктор Команд</h1>
        <p id="loading">Загрузка данных...</p>

        <div id="builder" style="display: none;">
            <div class="team-container">
                <h2>Команда Игрока 1</h2>
                <div class="tabs-wrapper">
                    <div class="tab-buttons" id="team-1-tab-buttons">
                        </div>
                    <div class="tab-contents" id="team-1-tab-contents">
                        </div>
                </div>
            </div>

            <div class="team-container">
                <h2>Команда Игрока 2</h2>
                 <div class="tabs-wrapper">
                    <div class="tab-buttons" id="team-2-tab-buttons">
                        </div>
                    <div class="tab-contents" id="team-2-tab-contents">
                        </div>
                </div>
            </div>
            
            <button id="submit-button-debug">Отправить данные (для отладки)</button>

        </div>
    </div>
    <script src="script.js"></script>

</html>
